appId: com.deepseek.dsh.desktop
productName: DeepSeek Harness
copyright: MIT License
directories:
  output: dist
  buildResources: build

# electron-builder strips nested node_modules from extraResources; this hook
# restores the bundled npm CLI's own dependencies after packing.
afterPack: scripts/after-pack.js

# Native modules (sharp / node-pty / koffi) are loaded by the bundled plain
# node.exe, so keep everything as real files and never rebuild for Electron.
asar: false
npmRebuild: false
buildDependenciesFromSource: false

files:
  - main.js
  - updater.js
  - session-watcher.js
  - profile-module-heal.js
  - patch-row-heal.js
  - preset-sync.js
  - preload.js
  - assets/**/*
  - package.json
  - "!**/*.md"
  - "!**/*.markdown"
  - "!**/*.map"
  - "!**/*.ts"
  - "!**/*.d.ts"
  - "!**/*.d.mts"
  - "!**/*.d.cts"
  - "!**/test/**"
  - "!**/tests/**"
  - "!**/__tests__/**"
  - "!**/docs/**"
  - "!**/examples/**"

extraResources:
  - from: vendor/node/node.exe
    to: node/node.exe
  - from: vendor/npm
    to: npm

win:
  icon: build/icon.ico
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64

portable:
  artifactName: DeepSeek-Harness-Portable-${arch}.${ext}

nsis:
  artifactName: DeepSeek-Harness-Setup-${arch}.${ext}
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DeepSeek Harness
  uninstallDisplayName: DeepSeek Harness

publish: null
